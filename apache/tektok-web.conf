# Vhost web TEKTOK — tektok.kameranusantara.id
#
#   sudo cp apache/tektok-web.conf /etc/apache2/sites-available/
#   sudo a2ensite tektok-web
#
# certbot --apache akan menambahkan vhost :443 turunan dan redirect dari :80.
<VirtualHost *:80>
    ServerName tektok.kameranusantara.id

    Include /etc/apache2/tektok-proxy.conf

    ErrorLog  ${APACHE_LOG_DIR}/tektok-web-error.log
    CustomLog ${APACHE_LOG_DIR}/tektok-web-access.log combined
</VirtualHost>
