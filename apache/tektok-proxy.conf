# =============================================================================
# Aturan proxy TEKTOK, dipakai bersama oleh vhost web dan vhost API.
#
# Kedua domain menunjuk ke Nginx TEKTOK yang sama di 127.0.0.1:8080; Nginx itu
# yang memilah /api, /socket.io, /livekit, /media, /uploads, dan SPA. Satu
# layanan internal, dua nama publik.
#
# Ini juga yang membuat lampiran laporan tetap tampil: backend mengembalikan URL
# relatif /media/<key>, yang di halaman web diselesaikan menjadi
# https://tektok.kameranusantara.id/media/<key> — jadi domain web pun harus bisa
# melayani /media dan /uploads, bukan hanya SPA.
#
#   sudo cp apache/tocs-proxy.conf /etc/apache2/tektok-proxy.conf
# =============================================================================

ProxyPreserveHost On
ProxyRequests Off

# Siaran bisa berjam-jam; jangan putus WebSocket yang sedang idle.
ProxyTimeout 3600

# mod_proxy_wstunnel tidak dipicu otomatis oleh ProxyPass biasa, jadi permintaan
# yang membawa `Upgrade: websocket` dialihkan lebih dulu ke skema ws://.
# Tanpa blok ini Socket.IO dan signalling LiveKit gagal upgrade, dan streaming
# tidak pernah tersambung.
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteCond %{HTTP:Connection} upgrade [NC]
RewriteRule ^/?(.*) ws://127.0.0.1:8080/$1 [P,L]

ProxyPass        / http://127.0.0.1:8080/
ProxyPassReverse / http://127.0.0.1:8080/

# Nginx di dalam container memakai header ini untuk tahu klien datang lewat
# HTTPS; tanpa itu backend menganggap koneksinya http.
# Mengikuti keadaan sebenarnya, jadi vhost :80 (sebelum certbot) tidak berbohong.
RequestHeader set X-Forwarded-Proto "https" env=HTTPS
RequestHeader set X-Forwarded-Proto "http"  env=!HTTPS

# Unggahan laporan bisa berisi video.
LimitRequestBody 31457280
