# Vhost API TEKTOK — api-tektok.kameranusantara.id
#
# Menunjuk ke Nginx internal yang sama dengan vhost web; pemilahan rute
# dilakukan Nginx berdasarkan path (/api, /socket.io, /livekit, /health).
#
#   sudo cp apache/tektok-api.conf /etc/apache2/sites-available/
#   sudo a2ensite tektok-api
<VirtualHost *:80>
    ServerName api-tektok.kameranusantara.id

    Include /etc/apache2/tektok-proxy.conf

    ErrorLog  ${APACHE_LOG_DIR}/tektok-api-error.log
    CustomLog ${APACHE_LOG_DIR}/tektok-api-access.log combined
</VirtualHost>
