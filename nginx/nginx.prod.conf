worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    client_max_body_size 30m;
    server_tokens off;

    log_format tocs '$remote_addr - $status "$request" ${request_time}s';
    access_log /var/log/nginx/access.log tocs;

    # Edge DoS guard only — per-account fairness is enforced in the API.
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream tocs_api     { server api:4000; keepalive 32; }
    upstream tocs_web     { server web:80; }
    upstream tocs_minio   { server minio:9000; }
    upstream tocs_livekit { server livekit:7880; }

    # ---------------------------------------------------------------- :80 ---
    server {
        listen 80;
        server_name tektok.kameranusantara.id;

        # Let's Encrypt HTTP-01 challenge must stay on plain HTTP.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------- :443 ---
    server {
        listen 443 ssl;
        http2 on;
        server_name tektok.kameranusantara.id;

        ssl_certificate     /etc/letsencrypt/live/tektok.kameranusantara.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tektok.kameranusantara.id/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # --- REST API ---------------------------------------------------
        location /api/ {
            limit_req zone=api burst=200 nodelay;
            proxy_pass http://tocs_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        # --- Socket.IO --------------------------------------------------
        location /socket.io/ {
            proxy_pass http://tocs_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- LiveKit signalling -----------------------------------------
        # A browser on an HTTPS page refuses ws:// as mixed content, so the
        # signalling socket is terminated here as wss:// and forwarded in the
        # clear inside the compose network. The trailing slash on proxy_pass
        # strips the /livekit prefix, so the client's /livekit/rtc/v1 arrives
        # at LiveKit as /rtc/v1.
        #
        # WebRTC *media* still travels UDP straight to the public IP and is not
        # subject to the mixed-content rule — that is why the firewall must open
        # the RTC port range as well.
        location /livekit/ {
            proxy_pass http://tocs_livekit/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- Object storage ---------------------------------------------
        location /media/ {
            proxy_pass http://tocs_minio/tocs-media/;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_intercept_errors on;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        location /uploads/ {
            proxy_pass http://tocs_api;
            proxy_set_header Host $host;
            expires 7d;
        }

        location /health {
            proxy_pass http://tocs_api/health;
            access_log off;
        }

        # --- SPA --------------------------------------------------------
        location / {
            proxy_pass http://tocs_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
