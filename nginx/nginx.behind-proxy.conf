# =============================================================================
# TOCS — konfigurasi Nginx untuk deployment DI BELAKANG reverse proxy lain.
#
# Dipakai bila VPS sudah menjalankan Apache/Nginx lain di port 80/443 (seperti
# 43.106.5.212, yang sudah melayani imt.mogiro.site). TLS diterminasi oleh
# proxy terluar; Nginx ini hanya mendengarkan HTTP polos di dalam container dan
# diikat ke 127.0.0.1 di host, jadi tidak terekspos ke internet.
#
# Bedanya dengan nginx.prod.conf: tidak ada blok SSL, tidak ada redirect 80->443,
# dan header keamanan diserahkan ke proxy terluar agar tidak dikirim dobel.
# =============================================================================
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    client_max_body_size 30m;
    server_tokens off;

    log_format tocs '$http_x_forwarded_for - $status "$request" ${request_time}s';
    access_log /var/log/nginx/access.log tocs;

    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Skema asli dari proxy terluar. Backend memakainya untuk menentukan apakah
    # klien datang lewat HTTPS; tanpa ini semuanya terbaca sebagai http.
    map $http_x_forwarded_proto $forwarded_scheme {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    upstream tocs_api     { server api:4000; keepalive 32; }
    upstream tocs_web     { server web:80; }
    upstream tocs_minio   { server minio:9000; }
    upstream tocs_livekit { server livekit:7880; }

    server {
        listen 80;
        server_name _;

        location /api/ {
            limit_req zone=api burst=200 nodelay;
            proxy_pass http://tocs_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        location /socket.io/ {
            proxy_pass http://tocs_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Signalling LiveKit. Slash di akhir proxy_pass membuang prefix /livekit,
        # sehingga /livekit/rtc/v1 dari klien sampai ke LiveKit sebagai /rtc/v1.
        location /livekit/ {
            proxy_pass http://tocs_livekit/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /media/ {
            proxy_pass http://tocs_minio/tocs-media/;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_intercept_errors on;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        location /uploads/ {
            proxy_pass http://tocs_api;
            proxy_set_header Host $host;
            expires 7d;
        }

        location /health {
            proxy_pass http://tocs_api/health;
            access_log off;
        }

        location / {
            proxy_pass http://tocs_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        }
    }
}
