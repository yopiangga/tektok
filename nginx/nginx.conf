worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    client_max_body_size 30m;   # report attachments (photo/video)

    log_format tocs '$remote_addr - $status "$request" ${request_time}s';
    access_log /var/log/nginx/access.log tocs;

    # Edge DoS guard only — per-account fairness is enforced in the API.
    # Sized for the whole deployment behind one NAT: 100 personnel × GPS every
    # 10s is ~10 r/s, and each dashboard opens ~12 queries at once. Too tight a
    # limit here rejects legitimate traffic from a shared egress IP.
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_status 429;   # default 503 misreports throttling as an outage

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream tocs_api {
        server api:4000;
        keepalive 32;
    }

    upstream tocs_web {
        server web:80;
    }

    upstream tocs_minio {
        server minio:9000;
    }

    server {
        listen 80;
        server_name _;

        # Uncomment once certificates are mounted, then serve on 443.
        # return 301 https://$host$request_uri;

        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # --- REST API ---------------------------------------------------
        location /api/ {
            limit_req zone=api burst=200 nodelay;
            proxy_pass http://tocs_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        # --- WebSocket (Socket.IO) --------------------------------------
        location /socket.io/ {
            proxy_pass http://tocs_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- Object storage (MinIO) -------------------------------------
        # Served from this origin so stored URLs stay host-agnostic and the
        # MinIO port never has to be exposed to clients.
        location /media/ {
            proxy_pass http://tocs_minio/tocs-media/;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_intercept_errors on;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # --- Locally stored media (MinIO disabled) ----------------------
        location /uploads/ {
            proxy_pass http://tocs_api;
            proxy_set_header Host $host;
            expires 7d;
        }

        location /health {
            proxy_pass http://tocs_api/health;
            access_log off;
        }

        # --- SPA --------------------------------------------------------
        location / {
            proxy_pass http://tocs_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
