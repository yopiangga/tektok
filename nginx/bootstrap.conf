# Minimal HTTP-only server used once, to answer the Let's Encrypt HTTP-01
# challenge before any certificate exists. nginx refuses to start with an
# ssl_certificate that is not on disk, so the full config cannot come first.
worker_processes 1;
events { worker_connections 256; }

http {
    server {
        listen 80;
        server_name tektok.kameranusantara.id;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 200 'TOCS: menunggu sertifikat TLS';
            add_header Content-Type text/plain;
        }
    }
}
